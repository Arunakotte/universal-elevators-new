<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 70" width="380" height="70" fill="none">
  <!-- Modern Geometric Elevator Tower Icon -->
  <g transform="translate(10, 5)">
    <!-- Outer Frame / Tower Column -->
    <rect x="0" y="0" width="48" height="60" rx="8" fill="#0A2540" />
    <!-- Golden Accent Border Highlight -->
    <rect x="1" y="1" width="46" height="58" rx="7" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.8" />
    
    <!-- Left Lift Column -->
    <rect x="6" y="8" width="16" height="44" rx="4" fill="#0052CC" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1.2" />
    <!-- Right Lift Column -->
    <rect x="26" y="8" width="16" height="44" rx="4" fill="#0052CC" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1.2" />
    
    <!-- Upward Moving Elevator Car (Left) -->
    <rect x="8" y="12" width="12" height="18" rx="2" fill="#0052CC" />
    <path d="M14 16 L11 21 H17 Z" fill="#FFFFFF" />
    
    <!-- Downward Moving Elevator Car (Right) -->
    <rect x="28" y="30" width="12" height="18" rx="2" fill="#D4AF37" />
    <path d="M34 44 L31 39 H37 Z" fill="#0A2540" />
    
    <!-- Subtle Golden Cable lines -->
    <line x1="14" y1="8" x2="14" y2="12" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" />
    <line x1="34" y1="8" x2="34" y2="30" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- Typography -->
  <g transform="translate(72, 16)">
    <!-- Brand Name -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="1.5" fill="#0A2540">
      UNIVERSAL
    </text>
    <text x="144" y="24" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5" fill="#0052CC">
      ELEVATORS
    </text>
    
    <!-- Tagline & Badge -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#D4AF37">
      TRUST FOR A JOYFUL JOURNEY
    </text>
    <text x="215" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="9" font-weight="500" letter-spacing="0.5" fill="#64748B">
      • BANGALORE
    </text>
  </g>
</svg>
